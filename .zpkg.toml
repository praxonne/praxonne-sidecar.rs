[package]
org = "praxonne"
name = "praxonne-sidecar"
version = "0.1.0"
description = "k8s sidecar for Praxonne."
license = "MIT"
keywords = ["sidecar", "observability", "k8s"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/praxonne/praxonne-sidecar.rs"

[dependencies]
"ores-otel/ores-otel-sidecar" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin praxonne-sidecar"
outputs = ["target/release/praxonne-sidecar"]

[bin]
praxonne-sidecar = "target/release/praxonne-sidecar"

[install]
adapter = "none"

[scripts]
test = "cargo test --all-targets --locked"
